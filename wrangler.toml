name = "catbet-fishing"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Le jeu (public/index.html) est servi tel quel ; seules les routes /api/* passent par le Worker.
[vars]
ADMIN_USERNAME = "AMCR"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "catbet"
database_id = "954a9588-8a54-4182-b8b0-80dcaabd7b0a"   # donné par : npx wrangler d1 create catbet

[observability.logs]
enabled = true
invocation_logs = true
persist = true
